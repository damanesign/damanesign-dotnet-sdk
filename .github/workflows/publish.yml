name: Publish to NuGet

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Damanesign.Sdk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Damanesign.Sdk.Tests/Damanesign.Sdk.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Damanesign.Sdk/Damanesign.Sdk.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
